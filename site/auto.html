<!-- ===== AUTOMATED ENTRY — for headless benchmarks ==========================
     This page preloads the tools because the bench drives the game through the
     ?autotest=... protocol, which lives in tools/panel.js.  It is NOT what a
     player opens:

        /              host page (iframe + 注入工具 button)
        /game.html     the vanilla game, zero tools
        /auto.html     this: game + tools, for scripts only

     Keeping these separate is what stops a mirror page from silently shipping an
     autopilot.  Do not point a human at this URL.

     Load order matters: core.js must be present before the game boots, because it
     re-paces requestAnimationFrame (speed warp) and seeds the RNG. -->
